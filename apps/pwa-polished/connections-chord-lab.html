<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Connections chord lab v1.0</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0a0908;
    color: #cdbfa8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }
  body { overflow: hidden; }

  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  .stage { position: relative; flex: 0 0 50%; min-height: 0; }
  #view {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }

  .bar {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    left: 8px;
    right: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    pointer-events: none;
  }
  .bar > * { pointer-events: auto; }
  .fps {
    position: absolute;
    right: 8px;
    bottom: 6px;
    font: 11px ui-monospace, Menlo, monospace;
    color: #6b6153;
    pointer-events: none;
    text-align: right;
    line-height: 1.5;
    white-space: pre;
  }
  .credit {
    position: absolute;
    left: 8px;
    bottom: 6px;
    font: 10px ui-monospace, Menlo, monospace;
    color: #6b6153;
    pointer-events: none;
  }

  button, select, input[type=number] {
    background: rgba(13, 12, 11, 0.8);
    border: 1px solid #3a342a;
    color: #cdbfa8;
    border-radius: 7px;
    padding: 7px 11px;
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
  }
  button:active { background: rgba(44, 40, 32, 0.9); }

  .drawer {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 40px);
    background: #12100d;
    border-top: 1px solid #2a2520;
    -webkit-overflow-scrolling: touch;
  }

  @media (orientation: landscape) and (min-width: 640px) {
    .app { flex-direction: row; }
    .stage { flex: 1 1 auto; }
    .drawer { flex: 0 0 360px; border-top: 0; border-left: 1px solid #2a2520; }
  }

  /* The strip preview stays in view while the sliders under it scroll. */
  .preview {
    position: sticky;
    top: 0;
    z-index: 1;
    margin: 0 -16px;
    padding: 10px 16px 8px;
    background: #12100d;
    border-bottom: 1px solid #2a2520;
  }
  .reader {
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #2a2520;
    padding: 10px 0 6px;
    text-align: center;
  }
  .reader h1 {
    margin: 0 0 4px;
    font-size: 1.35rem;
    font-weight: 600;
  }
  #strip { display: block; width: 100%; cursor: pointer; }
  .reader .verse {
    font-family: Georgia, serif;
    font-size: 13.5px;
    line-height: 1.5;
    padding: 6px 14px 0;
    text-align: left;
    opacity: 0.75;
  }
  .pick { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  .pick select { flex: 1; min-width: 0; }
  .pick input { width: 64px; }

  h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #8a7d66;
    margin: 18px 0 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  h2 button { padding: 4px 9px; font-size: 11px; text-transform: none; letter-spacing: 0; }

  .row {
    display: grid;
    grid-template-columns: 104px 1fr 52px;
    align-items: center;
    gap: 8px;
    margin: 6px 0;
  }
  .row label { font-size: 12.5px; color: #a89a82; }
  .row output { font: 12px ui-monospace, Menlo, monospace; color: #e8dcc8; text-align: right; }
  .row select { grid-column: 2 / 4; width: 100%; }
  input[type=range] { width: 100%; accent-color: #b07a3c; }

  .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 6px 0 8px; }
  .checks label { font-size: 12.5px; color: #a89a82; display: flex; align-items: center; gap: 5px; }
  input[type=checkbox] { accent-color: #b07a3c; width: 16px; height: 16px; }

  textarea {
    width: 100%;
    min-height: 220px;
    background: #0d0c0a;
    color: #e8dcc8;
    border: 1px solid #2a2520;
    border-radius: 6px;
    font: 11.5px/1.45 ui-monospace, Menlo, monospace;
    padding: 8px;
    resize: vertical;
  }
  .note { font-size: 12px; color: #6b6153; line-height: 1.45; margin: 4px 0; }
  .hint { font-size: 11.5px; color: #7d715e; line-height: 1.4; margin: -2px 0 10px; }
  .picked {
    font-size: 12.5px;
    color: #cdbfa8;
    line-height: 1.5;
    margin: 6px 0;
    padding: 8px 10px;
    background: #0d0c0a;
    border: 1px solid #2a2520;
    border-radius: 6px;
    min-height: 38px;
  }
  .picked b { color: #e8dcc8; font-weight: 600; }
</style>
</head>
<body>
  <div class="app">
    <div class="stage" id="stage">
      <canvas id="view"></canvas>
      <div class="bar">
        <button id="whole">Reset view</button>
        <button id="clear" hidden>Show all</button>
      </div>
      <div class="credit">Cross references: OpenBible.info (CC BY)</div>
      <div class="fps" id="fps"></div>
    </div>
    <aside class="drawer" id="drawer">
      <p class="note">Loading the connections…</p>
    </aside>
  </div>
  <script type="module" src="/connections-chord-lab.ts"></script>
</body>
</html>
