<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Atlas Lab</title>
<!-- The same face and the same source the app uses, so the map's chrome reads
     as part of the app rather than a tool bolted to the side of it. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Milonga&display=swap" />
<style>
  /* Chrome borrows the reader's palette so the map stops looking like a guest
     in its own app: same greys, same borders, same rose focus ring. */
  :root {
    --chrome:      #1a1a1a;
    --chrome-2:    #212121;
    --sunken:      #141414;
    --line:        #333;
    --line-2:      #3a3a3a;
    --text:        #e0e0e0;
    --dim:         #8a8a8a;
    --faint:       #5a5a5a;
    --focus:       #fb7185;

    --parchment:   #ece1c8;
    --ground:      #e6d9bd;
    --ink:         #3d3427;

    --nav-h:       46px;

    /* The app's display face. Body text stays on the system stack — Milonga is
       a display face and a paragraph of it is unreadable — so this is for
       chrome: the navbar, panel headings, captions and names. */
    --display: 'Milonga', cursive;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--chrome); color: var(--text); overflow: hidden;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  #shell { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* ---------------- the map's own navbar ---------------- */
  #nav {
    flex: none; height: var(--nav-h); display: flex; align-items: center; gap: 6px;
    padding: 0 8px; background: var(--chrome); border-bottom: 1px solid var(--line);
    position: relative; z-index: 1200;
  }
  #nav, .panel, #timeline-bar, #info { font-family: var(--display); }
  /* Anything that has to be read at length, or read exactly, opts back out:
     Scripture references, coordinates and the encyclopedia's prose. */
  .panel .row, .panel .val, #info-body .vb-ref, #info-body .info-lead,
  #info-body .info-sub, .res .m, #tl-year { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  .nav-group { display: flex; align-items: center; gap: 4px; }
  .nav-sep { width: 1px; height: 22px; background: var(--line); margin: 0 3px; flex: none; }
  .nav-spacer { flex: 1; }

  .btn {
    height: 30px; min-width: 30px; padding: 0 9px; border-radius: 6px; cursor: pointer;
    background: var(--chrome-2); border: 1px solid var(--line); color: var(--text);
    font: inherit; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap; transition: background .12s, border-color .12s, color .12s;
  }
  .btn:hover { background: #292929; border-color: var(--line-2); }
  .btn.on { background: #2f2a2b; border-color: var(--focus); color: #fff; }
  .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .btn svg { width: 15px; height: 15px; flex: none; }

  .btn-icon { padding: 0; justify-content: center; }

  /* Search: the reader's expander, same 230px slide and same sunken input. */
  .search-area { display: flex; align-items: center; flex: none; }
  .search-expander {
    width: 0; overflow: hidden; flex: none;
    transition: width .25s cubic-bezier(.4, 0, .2, 1);
  }
  .search-expander.open { width: 238px; }
  .search-inner {
    display: flex; align-items: center; height: 30px; width: 230px; margin-left: 6px;
    background: var(--sunken); border: 1px solid var(--line-2); border-radius: 6px;
    transition: border-color .15s;
  }
  .search-inner.focused { border-color: var(--focus); }
  .search-inner input {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: none;
    color: var(--text); font: inherit; font-size: 13px; padding: 0 9px;
  }
  .search-inner input::placeholder { color: #555; }
  .search-clear {
    background: none; border: 0; color: #666; cursor: pointer; padding: 0 8px;
    height: 100%; display: flex; align-items: center;
  }
  .search-clear:hover { color: #ccc; }

  /* ---------------- dropdown panels ---------------- */
  .panel {
    position: absolute; top: calc(var(--nav-h) - 4px); background: var(--chrome-2);
    border: 1px solid var(--line-2); border-radius: 9px; padding: 8px;
    box-shadow: 0 12px 30px rgba(0,0,0,.5); z-index: 1300; min-width: 210px;
  }
  .panel[hidden] { display: none !important; }
  .panel h4 {
    margin: 6px 4px 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--faint); font-weight: 400; font-family: var(--display);
  }
  .opt {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 8px;
    background: none; border: 0; border-radius: 6px; color: var(--text);
    font: inherit; font-size: 13px; cursor: pointer; text-align: left;
  }
  .opt:hover { background: #2b2b2b; }
  .opt.on { background: #322c2e; color: #fff; }
  /* The basemap picker keeps a tick: it is one choice out of several, not a
     set of independent switches. */
  .opt .tickmark { margin-left: auto; color: var(--focus); opacity: 0; }
  .opt.on .tickmark { opacity: 1; }

  /* A switch rather than a tick.
     A tick reads as "this happened"; a switch reads as "this is on, and you
     may turn it off", which is what a layer list is for. The app has no switch
     of its own yet — its toggles are pills that fill when active — so this
     borrows that palette and shape at the size a vertical list needs. */
  .opt .switch {
    margin-left: auto; flex: none; position: relative;
    width: 30px; height: 17px; border-radius: 999px;
    background: #3a3a3a; border: 1px solid #4a4a4a;
    transition: background .16s ease, border-color .16s ease;
  }
  .opt .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 11px; height: 11px; border-radius: 50%;
    background: #8a8a8a; transition: transform .16s ease, background .16s ease;
  }
  .opt.on .switch { background: #4a2f38; border-color: var(--focus); }
  .opt.on .switch::after { background: var(--focus); transform: translateX(13px); }
  .opt .offline-note { margin-left: auto; font-size: 10px; color: var(--faint); }

  .row { display: flex; align-items: center; gap: 9px; padding: 6px 8px; font-size: 12.5px; }
  .row label { color: var(--dim); flex: none; width: 62px; }
  .row input[type=range] { flex: 1; accent-color: var(--focus); }
  .row .val { width: 34px; text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }

  .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .panel-note {
    padding: 8px; margin-top: 4px; font-size: 11px; line-height: 1.45;
    color: var(--faint); border-top: 1px solid var(--line);
  }

  /* Also used standalone inside the right-hand group, where it can't lean on
     .nav-group for its layout. */
  .nav-fade { display: flex; align-items: center; gap: 7px; }
  #nav-layer-fade { margin: 0 2px; }
  .nav-fade label {
    font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint);
  }
  .nav-fade input[type=range] { width: 88px; accent-color: var(--focus); }
  .nav-fade .val {
    font-size: 11px; color: var(--dim); width: 32px; font-variant-numeric: tabular-nums;
  }
  #nav-layer-fade[hidden] { display: none !important; }
  @media (max-width: 1100px) { .nav-fade .val { display: none; } }
  @media (max-width: 900px) { .nav-fade label { display: none; } .nav-fade input[type=range] { width: 62px; } }

  /* Passage box: the same expander as search, so the navbar has one idiom. */
  .nav-reading { display: flex; align-items: center; flex: none; }
  .reading-expander {
    width: 0; overflow: hidden; flex: none;
    transition: width .25s cubic-bezier(.4, 0, .2, 1);
  }
  .reading-expander.open { width: 178px; }
  .reading-inner {
    display: flex; align-items: center; height: 30px; width: 170px; margin-left: 6px;
    background: var(--sunken); border: 1px solid var(--line-2); border-radius: 6px;
    transition: border-color .15s;
  }
  .reading-inner.focused { border-color: var(--focus); }
  .reading-inner input {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: none;
    color: var(--text); font: inherit; font-size: 13px; padding: 0 9px;
  }
  .reading-inner input::placeholder { color: #555; }

  /* ---------------- search results ---------------- */
  #results {
    position: absolute; top: calc(var(--nav-h) - 4px); z-index: 1300;
    width: 320px; max-height: 60vh; overflow-y: auto;
    background: var(--chrome-2); border: 1px solid var(--line-2); border-radius: 9px;
    padding: 6px; box-shadow: 0 12px 30px rgba(0,0,0,.5);
  }
  #results[hidden] { display: none !important; }
  .res {
    display: block; width: 100%; text-align: left; padding: 8px 9px; border: 0;
    background: none; border-radius: 6px; color: var(--text); font: inherit; cursor: pointer;
  }
  .res:hover { background: #2b2b2b; }
  .res .n { font-size: 13px; }
  .res .m { font-size: 11.5px; color: var(--dim); margin-top: 1px; }
  /* What kind of thing this is — a bay reads differently from a town. */
  .kindtag {
    margin-left: 7px; font-size: 10px; color: var(--faint);
    letter-spacing: .06em; text-transform: uppercase;
  }
  /* Splits the list into Scripture's places and the modern map, so a reader
     can see which world an answer came from without reading the detail. */
  .res-head {
    padding: 7px 12px 4px; font-size: 11px; font-weight: 400;
    letter-spacing: .1em; text-transform: uppercase; color: #9c8760;
    background: rgba(0,0,0,.03); border-bottom: 1px solid rgba(0,0,0,.06);
  }
  .res-head + .res { border-top: 0; }
  .res-empty { padding: 10px; color: var(--dim); font-size: 12.5px; }

  /* ---------------- the map ---------------- */
  /* The ground behind everything. Fade both the basemap and the overlay out and
     this is what remains, so it is parchment rather than a void. */
  #map-area { position: relative; flex: 1; min-height: 0; display: flex; }
  #map { flex: 1; min-height: 0; background: var(--ground); }
  .leaflet-container { background: var(--ground); font-family: inherit; outline: none; }
  /* Nothing floats on the map — the navbar owns every control. */
  .leaflet-control-container .leaflet-top,
  .leaflet-control-container .leaflet-bottom { display: none; }

  /* The placement engine measures these exact metrics to test for overlap, so
     line-height and letter-spacing here must match what it assumes. */
  .map-label {
    background: none; border: 0; box-shadow: none; white-space: nowrap; pointer-events: none;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    text-align: center; line-height: 1.25; overflow: visible;
  }
  .map-label.country {
    font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600;
    color: #4a4032; text-shadow: 0 0 3px var(--parchment), 0 0 7px var(--parchment);
  }
  /* The overlay's lands: the subject while the timeline is on, so a touch
     larger than the modern country names underneath them. */
  .map-label.land {
    font-size: 13px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600;
    color: #4a3418;
    text-shadow: 0 0 3px var(--parchment), 0 0 6px var(--parchment), 0 0 10px var(--parchment);
  }
  .map-label.sea {
    font-size: 11.5px; font-style: italic; letter-spacing: .2em; text-transform: uppercase;
    color: #3f6675; text-shadow: 0 0 3px #a9c4cf, 0 0 7px #a9c4cf;
  }
  .map-label.city {
    font-size: 11.5px; color: var(--ink); letter-spacing: .01em;
    text-shadow: 0 0 3px var(--parchment), 0 0 6px var(--parchment);
  }
  /* Ancient regions and peoples, from the Barrington name linework. */
  .map-label.ancient {
    font-size: 11.5px; letter-spacing: .18em; text-transform: uppercase; font-weight: 500;
    color: #6b4a22; text-shadow: 0 0 3px var(--parchment), 0 0 7px var(--parchment);
  }
  .map-label.people {
    font-size: 11px; font-style: italic; letter-spacing: .14em; font-weight: 500;
    color: #7a5c34; text-shadow: 0 0 3px var(--parchment), 0 0 7px var(--parchment);
  }
  .map-label.terrain {
    font-size: 10.5px; font-style: italic; letter-spacing: .13em; text-transform: uppercase;
    color: #8a7550; text-shadow: 0 0 3px var(--parchment), 0 0 7px var(--parchment);
  }
  /* A named lake, creek or bay the drawn basemap is too coarse to show as a
     shape — so the name is the only thing marking it. */
  .map-label.water-point {
    font-size: 11px; font-style: italic; color: #3f6675; letter-spacing: .02em;
    text-shadow: 0 0 3px var(--parchment), 0 0 6px var(--parchment);
  }
  /* Places Scripture names — the reason the map exists, so they read first. */
  .map-label.biblical {
    font-size: 12px; font-weight: 600; color: #7c3f34; letter-spacing: .03em;
    text-shadow: 0 0 3px var(--parchment), 0 0 6px var(--parchment), 0 0 9px var(--parchment);
  }
  .map-label.peak {
    font-size: 11px; color: #6a5340; letter-spacing: .02em;
    text-shadow: 0 0 3px var(--parchment), 0 0 6px var(--parchment);
  }

  /* ---------------- timeline ---------------- */
  /* One compact row: the era on the left, the slider filling the rest. The
     detail lives in a hover card so the bar doesn't eat the map. */
  #timeline-bar {
    flex: none; background: #151515; border-top: 1px solid var(--line);
    padding: 6px 14px calc(6px + env(safe-area-inset-bottom));
    display: flex; gap: 14px; align-items: center;
  }
  #timeline-bar[hidden] { display: none !important; }

  #tl-caption {
    flex: none; width: 230px; cursor: pointer; border-radius: 7px;
    padding: 4px 8px; position: relative;
  }
  #tl-caption:hover { background: #1f1f1f; }
  #tl-caption:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .tl-title {
    font-size: 13px; font-weight: 600; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .tl-years {
    font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase;
    color: #c98b3a; margin-top: 1px; display: flex; align-items: center; gap: 6px;
  }
  .tl-years .tl-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .tl-dot.attested { background: #8fc296; }
  .tl-dot.approximate { background: #c98b3a; }

  /* Detail on hover, so the bar stays one row tall. */
  .tl-more {
    position: absolute; left: 0; bottom: calc(100% + 8px); width: 320px;
    background: var(--chrome-2); border: 1px solid var(--line-2); border-radius: 9px;
    padding: 11px 13px; box-shadow: 0 12px 30px rgba(0,0,0,.55);
    opacity: 0; visibility: hidden; transition: opacity .13s; pointer-events: none;
  }
  #tl-caption:hover .tl-more, #tl-caption:focus-visible .tl-more { opacity: 1; visibility: visible; }
  .tl-blurb { font-size: 12px; color: var(--dim); line-height: 1.45; }
  .tl-note {
    font-size: 11px; color: var(--faint); margin-top: 7px; line-height: 1.4;
    border-left: 2px solid var(--line-2); padding-left: 7px;
  }
  /* Shown on the one era where the map stops guessing at shapes and starts
     drawing surveyed ones. Warm rather than warning: it marks a change in what
     the map is claiming, not a problem. */
  .tl-seam {
    font-size: 11px; color: #c2a878; margin-top: 8px; line-height: 1.45;
    border-left: 2px solid #7a5c34; padding-left: 7px;
  }

  .tl-tag {
    display: inline-block; margin-top: 8px; padding: 2px 8px; border-radius: 999px;
    font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
  }
  .tl-tag.attested    { background: rgba(90,140,95,.16);  color: #8fc296; border: 1px solid rgba(143,194,150,.3); }
  .tl-tag.approximate { background: rgba(201,139,58,.14); color: #c98b3a; border: 1px solid rgba(201,139,58,.32); }
  .tl-hint { font-size: 10px; color: var(--faint); margin-top: 9px; }

  #tl-controls { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
  #tl-play {
    width: 30px; height: 30px; flex: none; border-radius: 50%; cursor: pointer; padding: 0;
    border: 1px solid var(--line-2); background: var(--chrome-2); color: var(--text);
    display: grid; place-items: center; font-size: 11px;
  }
  #tl-play:hover { border-color: var(--focus); color: var(--focus); }
  #tl-play:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  /* The rail changes colour where the evidence changes character: amber while
     the map shows lands named in Scripture, green once borders are surveyed. */
  #tl-track { position: relative; flex: 1; min-width: 0; height: 34px; touch-action: none; cursor: pointer; }
  #tl-track:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
  #tl-rail {
    position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px;
    background: linear-gradient(to right,
      rgba(201,139,58,.5) 0%, rgba(201,139,58,.5) var(--split, 50%),
      rgba(143,194,150,.45) var(--split, 50%), rgba(143,194,150,.45) 100%);
  }
  .tl-tick { position: absolute; top: 5px; width: 2px; height: 12px; margin-left: -1px;
             background: #4a4a46; border-radius: 1px; }
  .tl-tick.on { background: var(--text); height: 18px; top: 2px; }
  .tl-lab {
    position: absolute; top: 20px; font-size: 9.5px; color: var(--faint);
    transform: translateX(-50%); white-space: nowrap; pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  .tl-lab.on { color: var(--text); }
  #tl-knob {
    position: absolute; top: 2px; width: 17px; height: 17px; margin-left: -8.5px; border-radius: 50%;
    background: var(--text); border: 4px solid #151515; box-shadow: 0 0 0 1px var(--line-2);
    pointer-events: none;
  }
  @media (prefers-reduced-motion: no-preference) { #tl-knob { transition: left .2s ease; } }

  /* ---------------- the ageing look ---------------- */
  #ink-defs { position: absolute; width: 0; height: 0; overflow: hidden; }

  /* Paper grain and a soft edge burn, both driven by how old the era is. */
  #grain {
    position: absolute; inset: 0; z-index: 700; pointer-events: none; opacity: 0;
    transition: opacity .45s ease;
    background-image:
      radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(88,62,26,.28) 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.5'/></svg>");
    background-blend-mode: multiply;
    mix-blend-mode: multiply;
  }

  /* The overlay's label pane ignores pointer events so lettering never blocks
     the map; a drawn mountain has to opt back in to be clickable. */
  .ridge { pointer-events: auto !important; cursor: pointer; }

  /* Applied to the overlay's ink only, so the modern basemap stays crisp. */
  .leaflet-pane.aged { filter: url(#ink-wobble); }
  @media (prefers-reduced-motion: reduce) { #grain { transition: none; } }

  /* ---------------- what you tapped ---------------- */
  /* ---------------- the photograph viewer ---------------- */
  /* Built to match the app's art viewer, which is what this becomes when the
     map moves across: black ground, the picture centred, pan and zoom, and the
     credit as a caption link rather than a jump out of the app. */
  #photo-viewer {
    position: fixed; inset: 0; z-index: 10000; background: #000;
    overscroll-behavior: contain; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  #photo-stage {
    position: absolute; inset: 0; overflow: hidden;
    /* Hands every touch to the drag handler instead of the browser's own pan. */
    touch-action: none; cursor: grab;
    display: flex; align-items: center; justify-content: center;
  }
  #photo-stage.zoomed { cursor: grabbing; }
  #photo-img {
    max-width: 100%; max-height: 100%; opacity: 0;
    transition: opacity .25s ease;
    transform-origin: center center;
  }
  #photo-img.ready { opacity: 1; }
  #photo-img.animating { transition: opacity .25s ease, transform .2s ease; }
  #photo-state {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #8d8578; font-size: 13px; pointer-events: none;
  }
  #photo-close {
    position: absolute; top: 12px; right: 12px; width: 34px; height: 34px;
    border-radius: 50%; border: 0; cursor: pointer; font-size: 15px;
    background: rgba(0,0,0,.55); color: #e8e2d4;
  }
  #photo-close:hover { background: rgba(0,0,0,.8); }
  #photo-caption {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(0,0,0,.82), rgba(0,0,0,0));
    color: #ddd6c6; font-size: 12.5px;
    display: flex; gap: 14px; align-items: flex-end; justify-content: space-between;
  }
  #photo-caption .cap-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  #photo-caption .cap-title { font-size: 15px; font-weight: 650; color: #f2ecdd; }
  #photo-caption .cap-meta { color: #b8b0a0; }
  #photo-caption .cap-licence { color: #8d8578; font-size: 11.5px; letter-spacing: .03em; }
  #photo-caption .cap-source { color: #9ec5d4; text-decoration: none; white-space: nowrap; }
  #photo-caption .cap-source:hover { text-decoration: underline; }

  /* The thumbnail on the place panel. Sized so the panel still leads with the
     name and the verses; the picture is an invitation, not the subject. */
  .info-photo {
    position: relative; margin: 8px 0 10px; border-radius: 6px; overflow: hidden;
    cursor: zoom-in; background: #cfc4a8; line-height: 0;
    border: 1px solid rgba(0,0,0,.12);
  }
  .info-photo img { width: 100%; height: 132px; object-fit: cover; display: block; }
  .info-photo .shot-credit {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 7px;
    font-size: 10.5px; line-height: 1.3; color: #efe9db;
    background: linear-gradient(to top, rgba(0,0,0,.7), rgba(0,0,0,0));
  }

  #info {
    position: absolute; top: 10px; right: 10px; bottom: 10px; width: 330px; z-index: 950;
    background: rgba(26,26,26,.95); border: 1px solid var(--line-2); border-radius: 11px;
    box-shadow: 0 16px 40px rgba(0,0,0,.5); backdrop-filter: blur(8px);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #info[hidden] { display: none !important; }
  #info-close {
    position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; z-index: 2;
    border-radius: 7px; border: 1px solid var(--line); background: var(--chrome-2);
    color: var(--dim); cursor: pointer; font-size: 12px;
  }
  #info-close:hover { color: var(--text); }
  #info-body { overflow-y: auto; padding: 14px 15px; }

  /* Milonga ships one weight, so anything here asking for bold gets a
     synthesised smear instead. Emphasis comes from size and colour. */
  .info-name { font-size: 18px; font-weight: 400; padding-right: 26px; }
  .info-sub { font-size: 11.5px; color: var(--dim); margin-top: 3px; }
  .info-where {
    margin-top: 10px; font-size: 12px; color: var(--dim); line-height: 1.5;
    border-left: 2px solid var(--line-2); padding-left: 9px;
  }
  .info-where b { color: var(--text); font-weight: 400; }
  .info-lead {
    margin-top: 11px; font-size: 12.5px; line-height: 1.55; color: #c8c3ba;
  }
  .info-h {
    margin: 15px 0 7px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--faint); font-weight: 400;
  }

  /* Verse list — the same shape as the word study, the encyclopedia and Nave's:
     a caret and a coloured book name, then full-width rows with the book's
     colour down the left edge. Deliberately not chips. */
  .vb-group { border-top: 1px solid rgba(255,255,255,.07); }
  .vb-header {
    display: flex; align-items: center; gap: 8px; width: 100%;
    background: none; border: none; color: var(--text);
    font-family: inherit; font-size: 13.5px; text-align: left;
    padding: 7px 4px; cursor: pointer;
  }
  .vb-header:hover { background: rgba(255,255,255,.04); }
  .vb-caret { font-size: 10px; }
  .vb-name { flex: 1; font-weight: 400; }
  .vb-count { color: var(--dim); font-size: 12px; }

  .vb-refs { display: none; flex-direction: column; gap: 4px; padding: 4px 4px 10px 24px; }
  .vb-group.open .vb-refs { display: flex; }

  .vb-ref {
    display: block; width: 100%; text-align: left;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-left: 3px solid;
    border-radius: 5px; padding: 6px 9px; cursor: pointer;
    font-family: inherit;
  }
  .vb-ref:hover { background: rgba(255,255,255,.08); }
  .vb-ref-label { font-size: 12px; font-weight: 600; }
  .vb-ref-text {
    display: block; color: #c2c6cd; font-size: 12.5px; margin-top: 3px; line-height: 1.45;
  }

  /* ---------------- status ---------------- */
  /* The key for the early centuries. Quiet on purpose: it should be findable
     if you wonder what the soft shapes are, and invisible if you don't. */
  #approx-key {
    position: absolute; left: 10px; bottom: 42px; z-index: 900;
    display: flex; align-items: center; gap: 7px;
    font-family: var(--display); font-size: 11px; color: #b3a68a;
    background: rgba(26,26,26,.86); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 9px; backdrop-filter: blur(6px);
    cursor: help;
  }
  #approx-key[hidden] { display: none !important; }
  #approx-key .key-band {
    width: 15px; height: 9px; border-radius: 2px; flex: none;
    background: #a8763f; border: 1px dashed #d7a35c; opacity: .85;
  }

  #status {
    position: absolute; left: 10px; bottom: 10px; z-index: 900; display: flex; gap: 8px;
    pointer-events: none;
    align-items: center; font-size: 11px; color: var(--dim);
    background: rgba(26,26,26,.86); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 9px; backdrop-filter: blur(6px);
  }
  #status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--focus); }
  #status.idle .dot { background: #4a7c50; }
  #credit-panel { right: 8px; left: auto !important; width: 300px; }
  #credit-panel .credit-item { padding: 7px 8px; font-size: 12px; line-height: 1.45; }
  #credit-panel .credit-item + .credit-item { border-top: 1px solid var(--line); }
  #credit-panel .credit-src { color: var(--text); }
  #credit-panel .credit-terms { color: var(--dim); font-size: 11px; margin-top: 2px; }
  #credit-panel .credit-free { color: #8fc296; }
  #credit-panel a { color: var(--focus); }
  #boot { position: fixed; inset: 0; z-index: 3000; display: grid; place-items: center;
          background: var(--chrome); color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<div id="shell">
  <div id="nav">
    <div class="nav-group">
      <button class="btn" id="basemap-btn" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 8 3 16 6 23 3 23 18 16 21 8 18 1 21"/><line x1="8" y1="3" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="21"/></svg>
        <span id="basemap-name">Parchment</span>
      </button>
    </div>

    <!-- Opacity earns a permanent place: it's the control you reach for while
         comparing the modern world against a historical overlay, so burying it
         in a panel makes the comparison a chore. -->
    <div class="nav-group nav-fade">
      <label for="nav-opacity" title="Basemap opacity">Map</label>
      <input type="range" id="nav-opacity" min="0" max="100" value="100" aria-label="Basemap opacity" />
      <span class="val" id="nav-opacity-val">100%</span>
    </div>

    <div class="nav-sep"></div>

    <div class="nav-group search-area">
      <button class="btn btn-icon" id="search-btn" aria-label="Search places">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <div class="search-expander" id="search-expander">
        <div class="search-inner" id="search-inner">
          <input id="search-input" type="text" placeholder="Search a place…" autocomplete="off" spellcheck="false" />
          <button class="search-clear" id="search-clear" aria-label="Clear">✕</button>
        </div>
      </div>
    </div>

    <div class="nav-spacer"></div>

    <div class="nav-group">
      <button class="btn" id="layers-btn" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="2 12 12 17 22 12"/><polyline points="2 17 12 22 22 17"/><polygon points="12 2 2 7 12 12 22 7"/></svg>
        Layers
      </button>

      <!-- Stands in for the reader: in the app this reference arrives from
           whatever passage is open, rather than being typed. -->
      <div class="nav-reading">
        <button class="btn btn-icon" id="reading-btn" aria-label="Follow a passage" title="Follow a passage">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v18H6.5A2.5 2.5 0 0 0 4 22z"/><path d="M4 4.5A2.5 2.5 0 0 0 6.5 7H20"/></svg>
        </button>
        <div class="reading-expander" id="reading-expander">
          <div class="reading-inner" id="reading-inner">
            <input id="reading-input" type="text" placeholder="Passage, e.g. Acts 17" autocomplete="off" spellcheck="false" />
          </div>
        </div>
      </div>

      <button class="btn" id="timeline-btn" title="Show the historical timeline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
        Timeline
      </button>

      <!-- The overlay's fade lives with the control that turns it on, so the
           thing you just enabled and the dial that tunes it sit together. -->
      <div class="nav-fade" id="nav-layer-fade" hidden>
        <label for="nav-layer-opacity" title="Overlay opacity">Layer</label>
        <input type="range" id="nav-layer-opacity" min="0" max="100" value="100" aria-label="Overlay opacity" />
        <span class="val" id="nav-layer-opacity-val">100%</span>
      </div>
      <button class="btn" id="world-btn" title="Zoom out to the whole world">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"/></svg>
        Whole world
      </button>
      <button class="btn btn-icon" id="credit-btn" aria-label="Map sources" title="Map sources" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16.5"/><circle cx="12" cy="7.8" r=".9" fill="currentColor"/></svg>
      </button>
    </div>

    <div class="panel" id="credit-panel" hidden></div>
    <div class="panel" id="basemap-panel" hidden></div>
    <div class="panel" id="layers-panel" hidden></div>
    <div id="results" hidden></div>
  </div>

  <!-- The map and anything floating over it share a box, so the status chip
       can't wander down over the timeline. -->
  <div id="map-area">
    <div id="map"></div>
    <!-- The wobble that makes old coastlines look drawn rather than plotted.
         `scale` is 0 until an era asks for it, so the modern map is untouched. -->
    <svg id="ink-defs" aria-hidden="true">
      <filter id="ink-wobble" x="-6%" y="-6%" width="112%" height="112%">
        <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="11" result="grain" />
        <feDisplacementMap id="ink-displace" in="SourceGraphic" in2="grain" scale="0"
                           xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <!-- Aged paper. Sits over the map and under everything you can touch. -->
    <div id="grain" aria-hidden="true"></div>

    <!-- Only while an era is showing lands rather than borders. It sits above
         the status chip so the info panel, which owns the right-hand side,
         never lands on top of it. -->
    <div id="approx-key" hidden
         title="These centuries show the lands their books name. No borders are drawn, because none are known.">
      <span class="key-band"></span>Approximate locations
    </div>

    <div id="status" class="idle"><span class="dot"></span><span id="status-text">ready</span></div>

    <!-- What you tapped. Sits over the map rather than in the navbar, because
         it belongs to the point you clicked, not to the map's controls. -->
    <aside id="info" hidden aria-live="polite">
      <button id="info-close" aria-label="Close">&#10005;</button>
      <div id="info-body"></div>
    </aside>
  </div>

  <!-- Photographs open here rather than at Wikimedia. The credit is a link in
       the caption, to be tapped on purpose or ignored — never a redirect. -->
  <div id="photo-viewer" hidden>
    <div id="photo-stage"><img id="photo-img" alt="" draggable="false" /></div>
    <div id="photo-state">Loading&#8230;</div>
    <button id="photo-close" aria-label="Close photograph">&#10005;</button>
    <div id="photo-caption">
      <div class="cap-text">
        <span class="cap-title"></span>
        <span class="cap-meta"></span>
        <span class="cap-licence"></span>
      </div>
      <a class="cap-source" target="_blank" rel="noopener noreferrer">Wikimedia Commons &#8599;</a>
    </div>
  </div>

  <div id="timeline-bar" hidden>
    <div id="tl-caption" role="button" tabindex="0" title="Frame this era"></div>
    <div id="tl-controls">
      <button id="tl-play" aria-label="Play through the eras">&#9654;</button>
      <div id="tl-track" role="slider" tabindex="0" aria-label="Era" aria-valuemin="0" aria-valuenow="0"></div>
    </div>
  </div>
</div>

<div id="boot">Loading the atlas…</div>

<script type="module" src="/atlas-lab.js"></script>
</body>
</html>
