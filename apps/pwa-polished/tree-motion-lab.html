<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tree motion lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Milonga&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0a0908;
    color: #cdbfa8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }
  body { overflow: hidden; }

  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  .stage { position: relative; flex: 0 0 55%; min-height: 0; }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }

  .bar {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    left: 8px;
    right: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    pointer-events: none;
  }
  .bar > * { pointer-events: auto; }
  .fps {
    position: absolute;
    right: 8px;
    bottom: 6px;
    font: 11px ui-monospace, Menlo, monospace;
    color: #6b6153;
    pointer-events: none;
  }

  button, select {
    background: rgba(13, 12, 11, 0.8);
    border: 1px solid #3a342a;
    color: #cdbfa8;
    border-radius: 7px;
    padding: 7px 11px;
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
  }
  button:active { background: rgba(44, 40, 32, 0.9); }
  button.primary { border-color: #6b5d3a; color: #e8dcc8; background: rgba(44, 40, 32, 0.9); }

  .drawer {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 40px);
    background: #12100d;
    border-top: 1px solid #2a2520;
    -webkit-overflow-scrolling: touch;
  }

  @media (orientation: landscape) and (min-width: 640px) {
    .app { flex-direction: row; }
    .stage { flex: 1 1 auto; }
    .drawer { flex: 0 0 340px; border-top: 0; border-left: 1px solid #2a2520; }
  }

  h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #8a7d66;
    margin: 18px 0 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  h2 button { padding: 4px 9px; font-size: 11px; text-transform: none; letter-spacing: 0; }

  .row {
    display: grid;
    grid-template-columns: 96px 1fr 52px;
    align-items: center;
    gap: 8px;
    margin: 6px 0;
  }
  .row label { font-size: 12.5px; color: #a89a82; }
  .row output { font: 12px ui-monospace, Menlo, monospace; color: #e8dcc8; text-align: right; }
  input[type=range] { width: 100%; accent-color: #b07a3c; }
  input[type=color] { width: 44px; height: 28px; border: 1px solid #3a342a; background: none; padding: 0; }

  .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 6px 0 8px; }
  .checks label { font-size: 12.5px; color: #a89a82; display: flex; align-items: center; gap: 5px; }
  input[type=checkbox] { accent-color: #b07a3c; width: 16px; height: 16px; }

  .curve { display: grid; grid-template-columns: 96px 1fr; gap: 8px; align-items: start; margin: 8px 0 12px; }
  .curve label { font-size: 12.5px; color: #a89a82; padding-top: 6px; }
  .curve select { width: 100%; }
  .curve canvas {
    width: 150px;
    height: 150px;
    margin-top: 6px;
    background: #0d0c0a;
    border: 1px solid #2a2520;
    border-radius: 6px;
  }

  textarea {
    width: 100%;
    min-height: 220px;
    background: #0d0c0a;
    color: #e8dcc8;
    border: 1px solid #2a2520;
    border-radius: 6px;
    font: 11.5px/1.45 ui-monospace, Menlo, monospace;
    padding: 8px;
    resize: vertical;
  }
  .note { font-size: 12px; color: #6b6153; line-height: 1.45; margin: 4px 0; }
</style>
</head>
<body>
  <div class="app">
    <div class="stage" id="stage">
      <canvas id="tree"></canvas>
      <div class="bar">
        <button class="primary" id="replay">Replay</button>
        <button id="zoomed">Start zoomed in</button>
        <button id="whole">Whole tree</button>
        <select id="who" aria-label="Who to land on"></select>
      </div>
      <div class="fps" id="fps"></div>
    </div>
    <aside class="drawer" id="drawer">
      <p class="note">Loading the tree…</p>
    </aside>
  </div>
  <script type="module" src="/tree-motion-lab.ts"></script>
</body>
</html>
