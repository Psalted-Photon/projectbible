<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="transparent">
  <!-- PWA: iOS fullscreen support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="irisBible">
  <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <title>irisBible</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Cinzel:wght@400;600&family=Cinzel+Decorative:wght@400;700&family=Jura:wght@400;600&family=Merriweather:wght@400;700&family=Milonga&display=swap">

  <!-- Leaflet's stylesheet is bundled with the map code (src/lib/atlas/map.js),
       so it arrives with the first map instead of from unpkg on every launch. -->

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    button, input, select, textarea {
      font-family: inherit;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Milonga', cursive;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #1a1a1a;
      color: #e0e0e0;
    }
    
    /* Phone-sized screens, the inside of a folding phone included: one size,
       so unfolding the phone does not make every button bigger. */
    @media (max-width: 768px) {
      html {
        font-size: 14px;
      }
    }
    
    #app {
      width: 100%;
      height: 100%;
      /* Safe area insets for iPhone notch / home indicator when using black-translucent status bar */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
      font-size: 20px;
      z-index: 9999;
    }

    @font-face {
      font-family: 'BerryRotunda';
      src: url('/fonts/berry-rotunda.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Teutonic4';
      src: url('/fonts/teutonic4.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    /* Gentium Plus (SIL, OFL — public/fonts/gentium-plus-OFL.txt): Greek,
       transliteration and pronunciation in the word studies. Google Fonts'
       own Greek and Latin subsets, unaltered, so only the ranges a page
       uses are fetched. It has no Hebrew; Hebrew falls through the stack. */
    @font-face {
      font-family: 'Gentium Plus';
      src: url('/fonts/gentium-plus-400-greek-ext.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      unicode-range: U+1F00-1FFF;
    }
    @font-face {
      font-family: 'Gentium Plus';
      src: url('/fonts/gentium-plus-400-greek.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;
    }
    @font-face {
      font-family: 'Gentium Plus';
      src: url('/fonts/gentium-plus-400-latin-ext.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: 'Gentium Plus';
      src: url('/fonts/gentium-plus-400-latin.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Gentium Plus';
      src: url('/fonts/gentium-plus-700-greek-ext.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
      unicode-range: U+1F00-1FFF;
    }
    @font-face {
      font-family: 'Gentium Plus';
      src: url('/fonts/gentium-plus-700-greek.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;
    }
    @font-face {
      font-family: 'Gentium Plus';
      src: url('/fonts/gentium-plus-700-latin-ext.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: 'Gentium Plus';
      src: url('/fonts/gentium-plus-700-latin.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    /* ── Custom theme reader fonts ────────────────────────────────────────
       Self-hosted so they work offline; latin subset only. All OFL or Apache
       licensed — see src/lib/readerFonts.ts for the picker table and the
       per-font size/line-height multipliers.

       Faces declaring a weight RANGE (e.g. `400 700`) are variable fonts:
       one file covers the whole range and the browser interpolates. Do not
       split those into two @font-face rules — Google serves the identical
       file for each weight, so that would ship the same bytes twice and stop
       interpolation from working. */
    @font-face {
      font-family: 'Bitter';
      src: url('/fonts/bitter.woff2') format('woff2');
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'CormorantGaramond';
      src: url('/fonts/cormorant-garamond.woff2') format('woff2');
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Marcellus';
      src: url('/fonts/marcellus-400.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'IMFellEnglish';
      src: url('/fonts/im-fell-english-400.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'GrenzeGotisch';
      src: url('/fonts/grenze-gotisch.woff2') format('woff2');
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Comfortaa';
      src: url('/fonts/comfortaa.woff2') format('woff2');
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Fredoka';
      src: url('/fonts/fredoka.woff2') format('woff2');
      font-weight: 400 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Caveat';
      src: url('/fonts/caveat.woff2') format('woff2');
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'PatrickHand';
      src: url('/fonts/patrick-hand-400.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'GloriaHallelujah';
      src: url('/fonts/gloria-hallelujah-400.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'SpecialElite';
      src: url('/fonts/special-elite-400.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Bangers';
      src: url('/fonts/bangers-400.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Chewy';
      src: url('/fonts/chewy-400.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Sniglet';
      src: url('/fonts/sniglet-400.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Sniglet';
      src: url('/fonts/sniglet-800.woff2') format('woff2');
      font-weight: 800;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'TitanOne';
      src: url('/fonts/titan-one-400.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'ShantellSans';
      src: url('/fonts/shantell-sans.woff2') format('woff2');
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Handlee';
      src: url('/fonts/handlee-400.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Tangerine';
      src: url('/fonts/tangerine-400.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Tangerine';
      src: url('/fonts/tangerine-700.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'GreatVibes';
      src: url('/fonts/great-vibes-400.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'RockSalt';
      src: url('/fonts/rock-salt-400.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
  </style>
</head>
<body>
  <div id="loading">Loading irisBible...</div>
  <div id="app"></div>
  <!-- Launch error display and the CSP watcher. See public/startup.js. -->
  <script src="/startup.js"></script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
