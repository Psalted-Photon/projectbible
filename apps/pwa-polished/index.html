  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    button, input, select, textarea {
      font-family: inherit;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Milonga', cursive;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #1a1a1a;
      color: #e0e0e0;
    }
    
    /* Increase base font size for tablet devices */
    @media (max-width: 768px) {
      html {
        font-size: 18px;
      }
    }

    /* Reduce font size for small phone portrait — override the tablet bump above */
    @media (max-width: 480px) {
      html {
        font-size: 14px;
      }
    }
    
    #app {
      width: 100%;
      height: 100%;
      /* Safe area insets for iPhone notch / home indicator when using black-translucent status bar */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
      font-size: 20px;
      z-index: 9999;
    }

    @font-face {
      font-family: 'BerryRotunda';
      src: url('/fonts/berry-rotunda.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Teutonic4';
      src: url('/fonts/teutonic4.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    /* ── Custom theme reader fonts ────────────────────────────────────────
       Self-hosted so they work offline; latin subset only. All OFL or Apache
       licensed — see src/lib/readerFonts.ts for the picker table and the
       per-font size/line-height multipliers.

       Faces declaring a weight RANGE (e.g. `400 700`) are variable fonts:
       one file covers the whole range and the browser interpolates. Do not
       split those into two @font-face rules — Google serves the identical
       file for each weight, so that would ship the same bytes twice and stop
       interpolation from working. */
    @font-face {
      font-family: 'Bitter';
      src: url('/fonts/bitter.woff2') format('woff2');
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'CormorantGaramond';

<body>
  <div id="loading">Loading Hexapla...</div>
  <div id="app"></div>
  <script>
    // Global error handler
    window.addEventListener('error', function(e) {
      document.getElementById('loading').innerHTML = 
        '<h2 style="color: #f44336;">ERROR</h2>' +
        '<p style="margin-top: 20px; font-size: 16px;">' + e.message + '</p>' +
        '<p style="margin-top: 10px; font-size: 14px; color: #888;">' + e.filename + ':' + e.lineno + '</p>';
    });
    
    window.addEventListener('unhandledrejection', function(e) {
      document.getElementById('loading').innerHTML = 
        '<h2 style="color: #f44336;">PROMISE ERROR</h2>' +
        '<p style="margin-top: 20px; font-size: 16px;">' + e.reason + '</p>';
    });
    
    // Hide loading message - check repeatedly until app mounts
    var checkInterval = setInterval(function() {
      var app = document.getElementById('app');
      var loading = document.getElementById('loading');
      if (app && app.children.length > 0) {
        if (loading) loading.style.display = 'none';
        clearInterval(checkInterval);
      }
    }, 100);
    
    // Fallback: hide after 5 seconds regardless
    setTimeout(function() {
      clearInterval(checkInterval);
      var loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
    }, 5000);
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
